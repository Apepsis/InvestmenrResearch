name: Validar codigo e investigacion

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar Python
        run: pip install -r requirements.txt

      - name: Pruebas contra leakage, score, datos y riesgo
        run: python scripts/run_tests.py

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar interfaz
        run: npm ci

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Construir GitHub Pages
        run: npm run build:pages
